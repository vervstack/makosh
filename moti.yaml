cache_path: proto_modules

deps:
  - github.com/googleapis/googleapis

generate:
  - inputs:
      - directory: "api/grpc"
    plugins:
      - name: go
        out: pkg/makosh_be
        opts:
          paths: source_relative
      - name: go-grpc
        out: pkg/makosh_be
        opts:
          paths: source_relative
      - name: grpc-gateway
        out: pkg/makosh_be
        opts:
          paths: source_relative
