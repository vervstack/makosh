syntax = "proto3";

package makosh_be_api;

import "google/api/annotations.proto";

option go_package = "/makosh_be";

service MakoshBeAPI {
  rpc Version(Version.Request) returns (Version.Response) {
    option (google.api.http) = {
      get: "/api/version"
    };
  };

  rpc ListEndpoints(ListEndpoints.Request) returns (ListEndpoints.Response) {
    option (google.api.http) = {
      get: "/api/endpoints/{service_name}"
    };
  };

  rpc UpsertEndpoints(UpsertEndpoints.Request) returns (UpsertEndpoints.Response) {
    option (google.api.http) = {
      post: "/api/endpoints"
      body: "*"
    };
  }

  rpc DeleteEndpoints(DeleteEndpoints.Request) returns (DeleteEndpoints.Response) {
    option (google.api.http) = {
      post: "/api/endpoints/delete"
      body: "*"
    };
  }
}

enum AddressScope {
  ADDRESS_SCOPE_UNSPECIFIED = 0;
  DOCKER = 1;
  VCN = 2;
}

message Address {
  string addr = 1;
  AddressScope scope = 2;
  string name = 3; // which exposed port/resource of the service this address reaches
}

message Version {
    message Request {}
    message Response {
      string version = 1;
    }
}


message ListEndpoints {
  message Request {
    string service_name = 1;
    AddressScope scope = 2; // UNSPECIFIED = all scopes
  }

  message Response {
    repeated string urls = 1;
    repeated Address addresses = 2;
  }
}


message Endpoint {
  string service_name = 1;
  repeated string addrs = 2;
  repeated Address addresses = 3;
}

message DeleteEndpoints {
  message Request {
    string service_name = 1;
    AddressScope scope = 2; // scope UNSPECIFIED removes the whole service
  }

  message Response {}
}

message UpsertEndpoints {
  message Request {
    repeated Endpoint endpoints = 1;
  }

  message Response {}
}